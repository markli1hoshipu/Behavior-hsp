[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mark-ik"
version = "0.1.0"
description = "IK solver utilities for R1Pro using PyTorch Kinematics"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Proprietary" }
authors = [
  { name = "mark_ik" }
]
keywords = ["ik", "inverse-kinematics", "robotics", "pytorch"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: Other/Proprietary License",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy>=1.20",
]

[project.optional-dependencies]
full = [
  "torch",
  "pytorch-kinematics",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mark_ik = ["r1pro.urdf"]


